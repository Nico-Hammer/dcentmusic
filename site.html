<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solana Transaction</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/solana-web3.js/1.33.0/solana-web3.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/0.21.1/axios.min.js"></script>
</head>
<body>
  <h1>Initialize A Solana Account</h1>
  <form id="transactionForm">
    <label for="data">Numeric Data:</label>
    <input type="number" id="data" name="data" placeholder="Enter a number" required><br><br>
    <label for="input">String Input:</label>
    <input type="text" id="input" name="input" placeholder="Enter up to 100 chars" required><br><br>
    <button type="submit">Submit Transaction</button>
  </form>
  <div id="transactionStatus"></div>
  <div id="transactionData"> </div>
  <script>
    document.getElementById('transactionForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const data = document.getElementById('data').value;
      const input = document.getElementById('input').value;
      try {
        const response = await axios.post('/initialize', { data, input });
        document.getElementById('transactionStatus').innerText = `Transaction successful: ${response.data.signature}`;
        document.getElementById('transactionData').innerHTML = `<p>Data: ${response.data.data}</p><p>Input: ${response.data.input}</p>`;
      } catch (error) {
        document.getElementById('transactionStatus').innerText = `Error: ${error.message}`;
      }
    });
  </script>
</body>
</html>
